name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: cp client-config.example.json client-config.json
      - run: npm run lint
      - run: npm test
      - run: npm run test:bdd
      - run: npm run bdd:validate
